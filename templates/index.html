<!DOCTYPE html>
<html>

<head>
    <title>Lakebase Support App</title>
</head>

<body>

<h1>Lakebase Support System</h1>

<h2>Create New Ticket</h2>

<form action="/create-ticket" method="POST">

    <label>Title:</label>
    <input type="text" name="title" required>
    <br><br>

    <label>Created By:</label>
    <input type="text" name="created_by" required>
    <br><br>


    <label>Status:</label>

    <select name="status">

        <option value="open">
            Open
        </option>

        <option value="in_progress">
            In Progress
        </option>

        <option value="resolved">
            Resolved
        </option>

    </select>
<br><br>
<label>Category:</label>

<select name="category">

    <option value="hardware">
        Hardware
    </option>

    <option value="software">
        Software
    </option>

    <option value="network">
        Network
    </option>

    <option value="access">
        Access
    </option>

</select>

<br><br>

    <label>Priority:</label>

        <select name="priority">

            <option value="low">
                Low
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="high">
                High
            </option>

        </select>



    <br><br>

    <button type="submit">
        Create Ticket
    </button>

</form>

<hr>

<table border="1">

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Status</th>
    <th>Category</th>
    <th>Priority</th>
    <th>Created By</th>
    <th>Action</th>
    
</tr>


{% for ticket in tickets %}

<tr>

<td>{{ ticket.ticket_id }}</td>

<td>{{ ticket.title }}</td>

<td>{{ ticket.status }}</td>

<td> {{ ticket.category }}</td>

<td>{{ ticket.priority}}</td>

<td>{{ ticket.created_by }}</td>

<td>
    <a href="/ticket/{{ ticket.ticket_id }}">
        View
    </a>
</td>

</tr>

{% endfor %}


</table>

</body>

</html>
